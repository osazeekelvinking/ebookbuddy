<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0D0E15;
    color: #FFF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }

  .canvas {
    width: 1200px;
    height: 1200px;
    position: relative;
    overflow: hidden;
    background: radial-gradient(circle at 50% 40%, #1F202E 0%, #0D0E15 70%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 60px 70px 70px;
  }

  /* Header */
  .header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }

  .brand-badge {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 12px 24px;
    border-radius: 999px;
  }

  .brand-badge .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #F26B21;
    box-shadow: 0 0 16px #F26B21;
  }

  .brand-badge span {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.05em;
    color: #FFF;
    text-transform: uppercase;
  }

  .brand-badge b { color: #F26B21; }

  .header-tag {
    background: rgba(242, 107, 33, 0.15);
    border: 1px solid #F26B21;
    color: #F26B21;
    font-size: 18px;
    font-weight: 800;
    padding: 10px 22px;
    border-radius: 999px;
    letter-spacing: 0.08em;
  }

  /* Headline: Minimal & Punchy */
  .headline-wrap {
    text-align: center;
    margin-top: 10px;
    z-index: 10;
  }

  .headline {
    font-size: 64px;
    font-weight: 900;
    line-height: 1.12;
    letter-spacing: -0.02em;
    color: #FFFFFF;
  }

  .headline span {
    color: #F26B21;
    text-shadow: 0 0 35px rgba(242, 107, 33, 0.4);
  }

  .subhead {
    font-size: 22px;
    color: #A3A3B2;
    margin-top: 8px;
    font-weight: 500;
  }

  /* Mascot Stage Area */
  .mascot-stage {
    position: relative;
    width: 780px;
    height: 600px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 10px 0;
  }

  /* Speech Bubble */
  .speech-bubble {
    position: absolute;
    top: 40px;
    right: 40px;
    background: #FFFFFF;
    color: #14141A;
    font-size: 24px;
    font-weight: 800;
    padding: 18px 28px;
    border-radius: 24px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: float 3s ease-in-out infinite;
  }

  .speech-bubble::after {
    content: '';
    position: absolute;
    bottom: -14px;
    left: 36px;
    border-width: 14px 14px 0;
    border-style: solid;
    border-color: #FFFFFF transparent;
    display: block;
    width: 0;
  }

  .speech-bubble.left {
    right: auto;
    left: 40px;
  }

  .speech-bubble.left::after {
    left: auto;
    right: 36px;
  }

  /* Footer Minimal Call to Action */
  .footer {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding-top: 24px;
    z-index: 10;
  }

  .footer-left {
    font-size: 22px;
    color: #8C8C9E;
    font-weight: 600;
  }

  .footer-left b { color: #FFF; }

  .footer-cta {
    background: #F26B21;
    color: #FFF;
    font-size: 22px;
    font-weight: 800;
    padding: 14px 34px;
    border-radius: 14px;
    letter-spacing: 0.04em;
    box-shadow: 0 8px 30px rgba(242, 107, 33, 0.4);
  }

body {
  margin: 0;
  padding: 0;
  background: #0D0E15;
  width: 1200px;
  height: 1200px;
  overflow: hidden;
}
.canvas {
  width: 1200px !important;
  height: 1200px !important;
}
</style>
</head>
<body>
<svg style="position:absolute; width:0; height:0;" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="glowOrange" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#F26B21" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#F26B21" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowTeal" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#22C55E" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="60%" stop-color="#F0EDEA"/>
    <stop offset="100%" stop-color="#D9D5D0"/>
  </linearGradient>
  <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#FF8A48"/>
    <stop offset="100%" stop-color="#F26B21"/>
  </linearGradient>
  <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#242634"/>
    <stop offset="100%" stop-color="#14151E"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
  </filter>
</defs>
</svg>
<div class="canvas" id="mascot-1">
    <div class="header">
      <div class="brand-badge">
        <div class="dot"></div>
        <span>Ebook <b>Buddy</b></span>
      </div>
      <div class="header-tag">AI EBOOK GENERATOR</div>
    </div>

    <div class="headline-wrap">
      <h1 class="headline">Stop Staring at a <span>Blank Page.</span></h1>
      <p class="subhead">Answer 3 simple questions. Get your full ebook blueprint.</p>
    </div>

    <div class="mascot-stage">
      <div class="speech-bubble">
        <span>✨</span> Done in 10 minutes!
      </div>

      <!-- Buddy SVG Character: Magic Writing -->
      <svg width="600" height="520" viewBox="0 0 600 520" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="glowOrange" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#F26B21" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#F26B21" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="60%" stop-color="#F0EDEA"/>
            <stop offset="100%" stop-color="#D9D5D0"/>
          </linearGradient>
          <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF8A48"/>
            <stop offset="100%" stop-color="#F26B21"/>
          </linearGradient>
          <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#242634"/>
            <stop offset="100%" stop-color="#14151E"/>
          </linearGradient>
          <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
          </filter>
        </defs>

        <!-- Ambient Backdrop Glow -->
        <circle cx="300" cy="280" r="220" fill="url(#glowOrange)"/>

        <!-- Shadow under character -->
        <ellipse cx="300" cy="460" rx="140" ry="24" fill="#06070A" opacity="0.8"/>

        <!-- FLOATING MAGIC HARDCOVER BOOK (Right) -->
        <g transform="translate(370, 160) rotate(-12)" filter="url(#shadow)">
          <!-- Pages depth -->
          <rect x="0" y="0" width="130" height="170" rx="14" fill="#FFFFFF"/>
          <rect x="4" y="4" width="122" height="162" rx="12" fill="#FAF6EE"/>
          <!-- Cover -->
          <rect x="0" y="0" width="128" height="170" rx="14" fill="url(#orangeGrad)"/>
          <!-- Spine shadow -->
          <rect x="0" y="0" width="18" height="170" rx="10" fill="#D35400" opacity="0.6"/>
          <!-- Book Emboss Star -->
          <circle cx="68" cy="75" r="24" fill="#FFF" opacity="0.9"/>
          <path d="M68 60L72 72L84 75L72 78L68 90L64 78L52 75L64 72Z" fill="#F26B21"/>
          <!-- Book title lines -->
          <rect x="36" y="115" width="60" height="8" rx="4" fill="#FFF" opacity="0.85"/>
          <rect x="46" y="130" width="40" height="6" rx="3" fill="#FFF" opacity="0.6"/>
          <!-- Sparkles emitting from book -->
          <circle cx="140" cy="20" r="6" fill="#FCD34D"/>
          <circle cx="-15" cy="50" r="4" fill="#FCD34D"/>
          <circle cx="150" cy="110" r="8" fill="#FCD34D"/>
          <circle cx="120" cy="-20" r="5" fill="#FFF"/>
        </g>

        <!-- BUDDY CHARACTER -->
        <!-- Antenna -->
        <rect x="294" y="90" width="12" height="40" rx="6" fill="#A3A3B2"/>
        <circle cx="300" cy="85" r="16" fill="url(#orangeGrad)" filter="url(#shadow)"/>
        <circle cx="300" cy="85" r="8" fill="#FFF" opacity="0.8"/>

        <!-- Ears / Headphone Cushions -->
        <rect x="180" y="170" width="22" height="54" rx="10" fill="url(#orangeGrad)"/>
        <rect x="398" y="170" width="22" height="54" rx="10" fill="url(#orangeGrad)"/>

        <!-- Head Base Shape -->
        <rect x="195" y="125" width="210" height="160" rx="55" fill="url(#bodyGrad)" filter="url(#shadow)"/>

        <!-- Face Screen Visor -->
        <rect x="215" y="145" width="170" height="120" rx="40" fill="url(#screenGrad)"/>

        <!-- Expressive Smiling Eyes (Cyan/White Glow) -->
        <!-- Left Eye (Winking Star or Big Happy Arc) -->
        <path d="M245 200C245 186 260 186 260 200" stroke="#00F5D4" stroke-width="9" stroke-linecap="round"/>
        <!-- Right Eye (Wide Happy Sparkling) -->
        <ellipse cx="335" cy="195" rx="18" ry="24" fill="#00F5D4"/>
        <circle cx="330" cy="188" rx="7" ry="9" fill="#FFFFFF"/>
        <circle cx="342" cy="205" r="4" fill="#FFFFFF"/>

        <!-- Cute Rosy Cheeks -->
        <circle cx="238" cy="225" r="12" fill="#F26B21" opacity="0.6"/>
        <circle cx="362" cy="225" r="12" fill="#F26B21" opacity="0.6"/>

        <!-- Cute Digital Smile -->
        <path d="M285 228Q300 240 315 228" stroke="#00F5D4" stroke-width="5" stroke-linecap="round" fill="none"/>

        <!-- Body / Torso -->
        <path d="M225 295C225 285 375 285 375 295L385 410C385 435 365 445 300 445C235 445 215 435 215 410Z" fill="url(#bodyGrad)" filter="url(#shadow)"/>

        <!-- Chest Heart / Power Core (Orange glowing "B") -->
        <circle cx="300" cy="355" r="30" fill="url(#orangeGrad)"/>
        <circle cx="300" cy="355" r="24" fill="#FFFFFF" opacity="0.2"/>
        <path d="M292 342H302C308 342 312 345 312 350C312 353 309 355 305 356C310 357 314 360 314 365C314 370 309 373 302 373H292V342ZM298 353H302C305 353 307 351 307 348C307 345 305 344 302 344H298V353ZM298 368H302C306 368 308 366 308 363C308 360 306 358 302 358H298V368Z" fill="#FFFFFF"/>

        <!-- Left Arm (Waving Cheerfully) -->
        <g transform="translate(195, 305) rotate(-35)">
          <rect x="-15" y="0" width="30" height="75" rx="15" fill="url(#bodyGrad)"/>
          <circle cx="0" cy="85" r="20" fill="url(#orangeGrad)"/>
        </g>

        <!-- Right Arm (Holding Magic Wand / Pointing to Book) -->
        <g transform="translate(385, 320) rotate(45)">
          <rect x="-15" y="0" width="30" height="85" rx="15" fill="url(#bodyGrad)"/>
          <circle cx="0" cy="95" r="22" fill="url(#orangeGrad)"/>
          <!-- Magic Wand -->
          <rect x="-6" y="90" width="12" height="70" rx="6" fill="#FBBF24"/>
          <!-- Star Tip -->
          <circle cx="0" cy="165" r="14" fill="#FFF"/>
          <circle cx="0" cy="165" r="10" fill="#F59E0B"/>
        </g>

        <!-- Cute Feet / Stabilizers -->
        <ellipse cx="255" cy="445" rx="28" ry="16" fill="url(#orangeGrad)"/>
        <ellipse cx="345" cy="445" rx="28" ry="16" fill="url(#orangeGrad)"/>
      </svg>
    </div>

    <div class="footer">
      <div class="footer-left">Turn your knowledge into an ebook · <b>100% Free Tool</b></div>
      <div class="footer-cta">Get Started Free →</div>
    </div>
  </div>
</body>
</html>
