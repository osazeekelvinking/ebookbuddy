<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0D0E15;
    color: #FFF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }

  .canvas {
    width: 1200px;
    height: 1200px;
    position: relative;
    overflow: hidden;
    background: radial-gradient(circle at 50% 40%, #1F202E 0%, #0D0E15 70%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 60px 70px 70px;
  }

  /* Header */
  .header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }

  .brand-badge {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 12px 24px;
    border-radius: 999px;
  }

  .brand-badge .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #F26B21;
    box-shadow: 0 0 16px #F26B21;
  }

  .brand-badge span {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.05em;
    color: #FFF;
    text-transform: uppercase;
  }

  .brand-badge b { color: #F26B21; }

  .header-tag {
    background: rgba(242, 107, 33, 0.15);
    border: 1px solid #F26B21;
    color: #F26B21;
    font-size: 18px;
    font-weight: 800;
    padding: 10px 22px;
    border-radius: 999px;
    letter-spacing: 0.08em;
  }

  /* Headline: Minimal & Punchy */
  .headline-wrap {
    text-align: center;
    margin-top: 10px;
    z-index: 10;
  }

  .headline {
    font-size: 64px;
    font-weight: 900;
    line-height: 1.12;
    letter-spacing: -0.02em;
    color: #FFFFFF;
  }

  .headline span {
    color: #F26B21;
    text-shadow: 0 0 35px rgba(242, 107, 33, 0.4);
  }

  .subhead {
    font-size: 22px;
    color: #A3A3B2;
    margin-top: 8px;
    font-weight: 500;
  }

  /* Mascot Stage Area */
  .mascot-stage {
    position: relative;
    width: 780px;
    height: 600px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 10px 0;
  }

  /* Speech Bubble */
  .speech-bubble {
    position: absolute;
    top: 40px;
    right: 40px;
    background: #FFFFFF;
    color: #14141A;
    font-size: 24px;
    font-weight: 800;
    padding: 18px 28px;
    border-radius: 24px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: float 3s ease-in-out infinite;
  }

  .speech-bubble::after {
    content: '';
    position: absolute;
    bottom: -14px;
    left: 36px;
    border-width: 14px 14px 0;
    border-style: solid;
    border-color: #FFFFFF transparent;
    display: block;
    width: 0;
  }

  .speech-bubble.left {
    right: auto;
    left: 40px;
  }

  .speech-bubble.left::after {
    left: auto;
    right: 36px;
  }

  /* Footer Minimal Call to Action */
  .footer {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding-top: 24px;
    z-index: 10;
  }

  .footer-left {
    font-size: 22px;
    color: #8C8C9E;
    font-weight: 600;
  }

  .footer-left b { color: #FFF; }

  .footer-cta {
    background: #F26B21;
    color: #FFF;
    font-size: 22px;
    font-weight: 800;
    padding: 14px 34px;
    border-radius: 14px;
    letter-spacing: 0.04em;
    box-shadow: 0 8px 30px rgba(242, 107, 33, 0.4);
  }

body {
  margin: 0;
  padding: 0;
  background: #0D0E15;
  width: 1200px;
  height: 1200px;
  overflow: hidden;
}
.canvas {
  width: 1200px !important;
  height: 1200px !important;
}
</style>
</head>
<body>
<svg style="position:absolute; width:0; height:0;" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="glowOrange" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#F26B21" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#F26B21" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowTeal" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#22C55E" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="60%" stop-color="#F0EDEA"/>
    <stop offset="100%" stop-color="#D9D5D0"/>
  </linearGradient>
  <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#FF8A48"/>
    <stop offset="100%" stop-color="#F26B21"/>
  </linearGradient>
  <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#242634"/>
    <stop offset="100%" stop-color="#14151E"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
  </filter>
</defs>
</svg>
<div class="canvas" id="mascot-4">
    <div class="header">
      <div class="brand-badge">
        <div class="dot"></div>
        <span>Ebook <b>Buddy</b></span>
      </div>
      <div class="header-tag" style="border-color:#22C55E; color:#22C55E;">100% FREE WEB APP</div>
    </div>

    <div class="headline-wrap">
      <h1 class="headline">No Subscription. <span>100% Free.</span></h1>
      <p class="subhead">No $497 courses. No credit cards. No lock-in.</p>
    </div>

    <div class="mascot-stage">
      <div class="speech-bubble">
        <span>🎁</span> Keep your wallet closed!
      </div>

      <!-- Buddy SVG Character: Popping out of Gift Box -->
      <svg width="600" height="520" viewBox="0 0 600 520" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="300" cy="280" r="220" fill="url(#glowTeal)"/>
        <ellipse cx="300" cy="470" rx="160" ry="24" fill="#06070A" opacity="0.8"/>

        <!-- Confetti Particles -->
        <rect x="120" y="140" width="16" height="8" rx="4" fill="#F43F5E" transform="rotate(25 120 140)"/>
        <rect x="440" y="130" width="18" height="9" rx="4" fill="#3B82F6" transform="rotate(-30 440 130)"/>
        <circle cx="160" cy="220" r="8" fill="#FACC15"/>
        <circle cx="460" cy="240" r="7" fill="#10B981"/>
        <rect x="200" y="80" width="14" height="7" rx="3" fill="#A855F7" transform="rotate(45 200 80)"/>
        <circle cx="390" cy="90" r="6" fill="#F97316"/>

        <!-- BUDDY CHARACTER (Top half) -->
        <!-- Antenna -->
        <rect x="294" y="60" width="12" height="40" rx="6" fill="#A3A3B2"/>
        <circle cx="300" cy="55" r="16" fill="url(#orangeGrad)" filter="url(#shadow)"/>

        <!-- Ears -->
        <rect x="180" y="140" width="22" height="54" rx="10" fill="url(#orangeGrad)"/>
        <rect x="398" y="140" width="22" height="54" rx="10" fill="url(#orangeGrad)"/>

        <!-- Head Base -->
        <rect x="195" y="95" width="210" height="160" rx="55" fill="url(#bodyGrad)" filter="url(#shadow)"/>

        <!-- Face Screen -->
        <rect x="215" y="115" width="170" height="120" rx="40" fill="url(#screenGrad)"/>

        <!-- Joyful Anime Cheerful Eyes -->
        <path d="M240 170Q255 150 270 170" stroke="#00F5D4" stroke-width="8" stroke-linecap="round" fill="none"/>
        <path d="M330 170Q345 150 360 170" stroke="#00F5D4" stroke-width="8" stroke-linecap="round" fill="none"/>

        <!-- Rosy Cheeks -->
        <circle cx="242" cy="190" r="14" fill="#F26B21" opacity="0.6"/>
        <circle cx="358" cy="190" r="14" fill="#F26B21" opacity="0.6"/>

        <!-- Big Open Laughing Mouth -->
        <path d="M280 185Q300 215 320 185Z" fill="#F43F5E"/>

        <!-- Arms Raised in Celebration (Hurray!) -->
        <g transform="translate(180, 200) rotate(-65)">
          <rect x="-15" y="0" width="30" height="85" rx="15" fill="url(#bodyGrad)"/>
          <circle cx="0" cy="95" r="22" fill="url(#orangeGrad)"/>
        </g>
        <g transform="translate(420, 200) rotate(65)">
          <rect x="-15" y="0" width="30" height="85" rx="15" fill="url(#bodyGrad)"/>
          <circle cx="0" cy="95" r="22" fill="url(#orangeGrad)"/>
        </g>

        <!-- GIFT BOX (Front) -->
        <g transform="translate(150, 250)" filter="url(#shadow)">
          <!-- Box Base -->
          <rect x="0" y="40" width="300" height="180" rx="20" fill="url(#orangeGrad)"/>
          <!-- Vertical Ribbon -->
          <rect x="120" y="40" width="60" height="180" fill="#FFFFFF"/>
          <!-- Golden Badge "$0 FREE" on Box -->
          <circle cx="150" cy="130" r="45" fill="#22C55E" filter="url(#shadow)"/>
          <text x="150" y="125" font-size="28" font-weight="900" fill="#FFF" text-anchor="middle">$0</text>
          <text x="150" y="148" font-size="14" font-weight="900" fill="#FFF" text-anchor="middle">FREE</text>

          <!-- Open Lid tilted back -->
          <path d="M-20 40L150 -10L320 40H-20Z" fill="#D35400" opacity="0.5"/>
          <!-- Lid Rim -->
          <rect x="-15" y="30" width="330" height="24" rx="8" fill="#FF8A48"/>
          <rect x="110" y="30" width="80" height="24" fill="#FFFFFF"/>
        </g>
      </svg>
    </div>

    <div class="footer">
      <div class="footer-left">Works with Claude, ChatGPT, Gemini & DeepSeek · <b>Free</b></div>
      <div class="footer-cta">Access Free App →</div>
    </div>
  </div>
</body>
</html>
