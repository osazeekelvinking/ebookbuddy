<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ebGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F26B21"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <filter id="ebGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Rounded Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#ebGrad)"/>
  
  <!-- Stylized Open Book Symbol -->
  <g filter="url(#ebGlow)" fill="#FFFFFF">
    <!-- Left Page -->
    <path d="M14 20.5 C 14 19.5, 19 19, 30 22 L 30 46 C 20 43, 15 43.5, 14 44.5 Z"/>
    <!-- Right Page -->
    <path d="M50 20.5 C 50 19.5, 45 19, 34 22 L 34 46 C 44 43, 49 43.5, 50 44.5 Z"/>
    <!-- Spine Center -->
    <rect x="31" y="21" width="2" height="25" rx="1" fill="#FFF1E8"/>
    <!-- Bookmark Ribbon Ribbon / Sparkle -->
    <polygon points="32,16 35,21 32,23 29,21" fill="#FFD166"/>
  </g>
</svg>
