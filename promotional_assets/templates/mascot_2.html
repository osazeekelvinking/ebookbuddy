<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0D0E15;
    color: #FFF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }

  .canvas {
    width: 1200px;
    height: 1200px;
    position: relative;
    overflow: hidden;
    background: radial-gradient(circle at 50% 40%, #1F202E 0%, #0D0E15 70%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 60px 70px 70px;
  }

  /* Header */
  .header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }

  .brand-badge {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 12px 24px;
    border-radius: 999px;
  }

  .brand-badge .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #F26B21;
    box-shadow: 0 0 16px #F26B21;
  }

  .brand-badge span {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.05em;
    color: #FFF;
    text-transform: uppercase;
  }

  .brand-badge b { color: #F26B21; }

  .header-tag {
    background: rgba(242, 107, 33, 0.15);
    border: 1px solid #F26B21;
    color: #F26B21;
    font-size: 18px;
    font-weight: 800;
    padding: 10px 22px;
    border-radius: 999px;
    letter-spacing: 0.08em;
  }

  /* Headline: Minimal & Punchy */
  .headline-wrap {
    text-align: center;
    margin-top: 10px;
    z-index: 10;
  }

  .headline {
    font-size: 64px;
    font-weight: 900;
    line-height: 1.12;
    letter-spacing: -0.02em;
    color: #FFFFFF;
  }

  .headline span {
    color: #F26B21;
    text-shadow: 0 0 35px rgba(242, 107, 33, 0.4);
  }

  .subhead {
    font-size: 22px;
    color: #A3A3B2;
    margin-top: 8px;
    font-weight: 500;
  }

  /* Mascot Stage Area */
  .mascot-stage {
    position: relative;
    width: 780px;
    height: 600px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 10px 0;
  }

  /* Speech Bubble */
  .speech-bubble {
    position: absolute;
    top: 40px;
    right: 40px;
    background: #FFFFFF;
    color: #14141A;
    font-size: 24px;
    font-weight: 800;
    padding: 18px 28px;
    border-radius: 24px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: float 3s ease-in-out infinite;
  }

  .speech-bubble::after {
    content: '';
    position: absolute;
    bottom: -14px;
    left: 36px;
    border-width: 14px 14px 0;
    border-style: solid;
    border-color: #FFFFFF transparent;
    display: block;
    width: 0;
  }

  .speech-bubble.left {
    right: auto;
    left: 40px;
  }

  .speech-bubble.left::after {
    left: auto;
    right: 36px;
  }

  /* Footer Minimal Call to Action */
  .footer {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding-top: 24px;
    z-index: 10;
  }

  .footer-left {
    font-size: 22px;
    color: #8C8C9E;
    font-weight: 600;
  }

  .footer-left b { color: #FFF; }

  .footer-cta {
    background: #F26B21;
    color: #FFF;
    font-size: 22px;
    font-weight: 800;
    padding: 14px 34px;
    border-radius: 14px;
    letter-spacing: 0.04em;
    box-shadow: 0 8px 30px rgba(242, 107, 33, 0.4);
  }

body {
  margin: 0;
  padding: 0;
  background: #0D0E15;
  width: 1200px;
  height: 1200px;
  overflow: hidden;
}
.canvas {
  width: 1200px !important;
  height: 1200px !important;
}
</style>
</head>
<body>
<svg style="position:absolute; width:0; height:0;" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="glowOrange" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#F26B21" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#F26B21" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowTeal" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#22C55E" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="60%" stop-color="#F0EDEA"/>
    <stop offset="100%" stop-color="#D9D5D0"/>
  </linearGradient>
  <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#FF8A48"/>
    <stop offset="100%" stop-color="#F26B21"/>
  </linearGradient>
  <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#242634"/>
    <stop offset="100%" stop-color="#14151E"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
  </filter>
</defs>
</svg>
<div class="canvas" id="mascot-2">
    <div class="header">
      <div class="brand-badge">
        <div class="dot"></div>
        <span>Ebook <b>Buddy</b></span>
      </div>
      <div class="header-tag">48-HOUR FAST START</div>
    </div>

    <div class="headline-wrap">
      <h1 class="headline">Launch Your Ebook <span>This Weekend.</span></h1>
      <p class="subhead">No stress. No endless writing. Just 3 simple steps.</p>
    </div>

    <div class="mascot-stage">
      <div class="speech-bubble">
        <span>🍹</span> That was easy!
      </div>

      <!-- Buddy SVG Character: Chilling with Sunglasses -->
      <svg width="600" height="520" viewBox="0 0 600 520" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="glowTeal" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#22C55E" stop-opacity="0.45"/>
            <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- Ambient Backdrop Glow -->
        <circle cx="300" cy="280" r="220" fill="url(#glowTeal)"/>
        <ellipse cx="300" cy="460" rx="150" ry="24" fill="#06070A" opacity="0.8"/>

        <!-- Laptop on a mini stand (Right) -->
        <g transform="translate(370, 310)" filter="url(#shadow)">
          <!-- Laptop Screen -->
          <rect x="0" y="0" width="130" height="90" rx="10" fill="#1E1E27" stroke="#2E2E3A" stroke-width="2"/>
          <rect x="10" y="10" width="110" height="70" rx="6" fill="#14141A"/>
          <!-- Green Success Badge on Laptop -->
          <rect x="20" y="25" width="90" height="24" rx="12" fill="#22C55E"/>
          <text x="65" y="41" font-size="11" font-weight="900" fill="#FFF" text-anchor="middle">PUBLISHED 100%</text>
          <!-- Checkmark -->
          <circle cx="65" cy="62" r="8" fill="#22C55E"/>
          <path d="M62 62L64 64L68 60" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
          <!-- Laptop Base -->
          <path d="M-15 90H145L135 105H-5Z" fill="#A3A3B2"/>
        </g>

        <!-- Coconut Drink with Straw (Left) -->
        <g transform="translate(130, 330)" filter="url(#shadow)">
          <ellipse cx="35" cy="50" rx="35" ry="32" fill="#8B5A2B"/>
          <!-- Drink opening -->
          <ellipse cx="35" cy="30" rx="28" ry="16" fill="#F5E6D3"/>
          <ellipse cx="35" cy="30" rx="22" ry="12" fill="#38BDF8"/>
          <!-- Straw -->
          <path d="M35 30L20 -15L5 -20" stroke="#EF4444" stroke-width="8" stroke-linecap="round" fill="none"/>
          <!-- Mini umbrella -->
          <path d="M45 15L75 -5C65 -20 40 -15 45 15Z" fill="#FACC15"/>
        </g>

        <!-- BUDDY CHARACTER -->
        <!-- Antenna with tropical flower -->
        <rect x="294" y="90" width="12" height="40" rx="6" fill="#A3A3B2"/>
        <circle cx="300" cy="85" r="16" fill="url(#orangeGrad)" filter="url(#shadow)"/>
        <!-- Flower -->
        <circle cx="316" cy="85" r="8" fill="#EC4899"/>
        <circle cx="316" cy="85" r="3" fill="#FACC15"/>

        <!-- Ears / Headphone Cushions -->
        <rect x="180" y="170" width="22" height="54" rx="10" fill="url(#orangeGrad)"/>
        <rect x="398" y="170" width="22" height="54" rx="10" fill="url(#orangeGrad)"/>

        <!-- Head Base -->
        <rect x="195" y="125" width="210" height="160" rx="55" fill="url(#bodyGrad)" filter="url(#shadow)"/>

        <!-- Face Screen -->
        <rect x="215" y="145" width="170" height="120" rx="40" fill="url(#screenGrad)"/>

        <!-- COOL RETRO SUNGLASSES -->
        <g filter="url(#shadow)">
          <!-- Frames -->
          <rect x="228" y="175" width="64" height="42" rx="12" fill="#18181B" stroke="#F26B21" stroke-width="4"/>
          <rect x="308" y="175" width="64" height="42" rx="12" fill="#18181B" stroke="#F26B21" stroke-width="4"/>
          <!-- Bridge -->
          <rect x="290" y="185" width="20" height="6" rx="3" fill="#F26B21"/>
          <!-- Lens Glare -->
          <path d="M236 208L252 183" stroke="#FFF" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
          <path d="M316 208L332 183" stroke="#FFF" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
        </g>

        <!-- Big Confident Grin -->
        <path d="M275 235Q300 255 325 235" stroke="#00F5D4" stroke-width="6" stroke-linecap="round" fill="none"/>

        <!-- Body / Torso (Relaxed lean back) -->
        <path d="M225 295C225 285 375 285 375 295L385 410C385 435 365 445 300 445C235 445 215 435 215 410Z" fill="url(#bodyGrad)" filter="url(#shadow)"/>

        <!-- Chest Badge -->
        <circle cx="300" cy="355" r="28" fill="url(#orangeGrad)"/>
        <!-- Star symbol -->
        <path d="M300 338L304 350L316 352L306 358L309 370L300 363L291 370L294 358L284 352L296 350Z" fill="#FFF"/>

        <!-- Left Arm Chilling -->
        <g transform="translate(195, 320) rotate(-20)">
          <rect x="-15" y="0" width="30" height="80" rx="15" fill="url(#bodyGrad)"/>
          <circle cx="0" cy="85" r="20" fill="url(#orangeGrad)"/>
        </g>

        <!-- Right Arm Peace Sign -->
        <g transform="translate(385, 310) rotate(30)">
          <rect x="-15" y="0" width="30" height="75" rx="15" fill="url(#bodyGrad)"/>
          <circle cx="0" cy="85" r="22" fill="url(#orangeGrad)"/>
        </g>

        <!-- Feet -->
        <ellipse cx="255" cy="445" rx="28" ry="16" fill="url(#orangeGrad)"/>
        <ellipse cx="345" cy="445" rx="28" ry="16" fill="url(#orangeGrad)"/>
      </svg>
    </div>

    <div class="footer">
      <div class="footer-left">Spend your weekend launching, not writing · <b>Free App</b></div>
      <div class="footer-cta">Start 48H Draft →</div>
    </div>
  </div>
</body>
</html>
