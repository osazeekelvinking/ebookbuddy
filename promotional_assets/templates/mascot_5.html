<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0D0E15;
    color: #FFF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }

  .canvas {
    width: 1200px;
    height: 1200px;
    position: relative;
    overflow: hidden;
    background: radial-gradient(circle at 50% 40%, #1F202E 0%, #0D0E15 70%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 60px 70px 70px;
  }

  /* Header */
  .header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }

  .brand-badge {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 12px 24px;
    border-radius: 999px;
  }

  .brand-badge .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #F26B21;
    box-shadow: 0 0 16px #F26B21;
  }

  .brand-badge span {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.05em;
    color: #FFF;
    text-transform: uppercase;
  }

  .brand-badge b { color: #F26B21; }

  .header-tag {
    background: rgba(242, 107, 33, 0.15);
    border: 1px solid #F26B21;
    color: #F26B21;
    font-size: 18px;
    font-weight: 800;
    padding: 10px 22px;
    border-radius: 999px;
    letter-spacing: 0.08em;
  }

  /* Headline: Minimal & Punchy */
  .headline-wrap {
    text-align: center;
    margin-top: 10px;
    z-index: 10;
  }

  .headline {
    font-size: 64px;
    font-weight: 900;
    line-height: 1.12;
    letter-spacing: -0.02em;
    color: #FFFFFF;
  }

  .headline span {
    color: #F26B21;
    text-shadow: 0 0 35px rgba(242, 107, 33, 0.4);
  }

  .subhead {
    font-size: 22px;
    color: #A3A3B2;
    margin-top: 8px;
    font-weight: 500;
  }

  /* Mascot Stage Area */
  .mascot-stage {
    position: relative;
    width: 780px;
    height: 600px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 10px 0;
  }

  /* Speech Bubble */
  .speech-bubble {
    position: absolute;
    top: 40px;
    right: 40px;
    background: #FFFFFF;
    color: #14141A;
    font-size: 24px;
    font-weight: 800;
    padding: 18px 28px;
    border-radius: 24px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: float 3s ease-in-out infinite;
  }

  .speech-bubble::after {
    content: '';
    position: absolute;
    bottom: -14px;
    left: 36px;
    border-width: 14px 14px 0;
    border-style: solid;
    border-color: #FFFFFF transparent;
    display: block;
    width: 0;
  }

  .speech-bubble.left {
    right: auto;
    left: 40px;
  }

  .speech-bubble.left::after {
    left: auto;
    right: 36px;
  }

  /* Footer Minimal Call to Action */
  .footer {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding-top: 24px;
    z-index: 10;
  }

  .footer-left {
    font-size: 22px;
    color: #8C8C9E;
    font-weight: 600;
  }

  .footer-left b { color: #FFF; }

  .footer-cta {
    background: #F26B21;
    color: #FFF;
    font-size: 22px;
    font-weight: 800;
    padding: 14px 34px;
    border-radius: 14px;
    letter-spacing: 0.04em;
    box-shadow: 0 8px 30px rgba(242, 107, 33, 0.4);
  }

body {
  margin: 0;
  padding: 0;
  background: #0D0E15;
  width: 1200px;
  height: 1200px;
  overflow: hidden;
}
.canvas {
  width: 1200px !important;
  height: 1200px !important;
}
</style>
</head>
<body>
<svg style="position:absolute; width:0; height:0;" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="glowOrange" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#F26B21" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#F26B21" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowTeal" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#22C55E" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="60%" stop-color="#F0EDEA"/>
    <stop offset="100%" stop-color="#D9D5D0"/>
  </linearGradient>
  <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#FF8A48"/>
    <stop offset="100%" stop-color="#F26B21"/>
  </linearGradient>
  <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#242634"/>
    <stop offset="100%" stop-color="#14151E"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
  </filter>
</defs>
</svg>
<div class="canvas" id="mascot-5">
    <div class="header">
      <div class="brand-badge">
        <div class="dot"></div>
        <span>Ebook <b>Buddy</b></span>
      </div>
      <div class="header-tag" style="border-color:#22C55E; color:#22C55E;">PASSIVE INCOME</div>
    </div>

    <div class="headline-wrap">
      <h1 class="headline">Turn 1 Problem Into <span>$50/Day.</span></h1>
      <p class="subhead">Sell 2 copies a day. Make $19,440/year on autopilot.</p>
    </div>

    <div class="mascot-stage">
      <div class="speech-bubble">
        <span>💰</span> Sales while you sleep!
      </div>

      <!-- Buddy SVG Character: Hugging Giant Gold Coin -->
      <svg width="600" height="520" viewBox="0 0 600 520" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="300" cy="280" r="220" fill="url(#glowTeal)"/>
        <ellipse cx="300" cy="460" rx="160" ry="24" fill="#06070A" opacity="0.8"/>

        <!-- Raining Golden Coins and Notes around -->
        <g transform="translate(80, 120) rotate(-20)" filter="url(#shadow)">
          <circle cx="30" cy="30" r="24" fill="#FACC15" stroke="#EAB308" stroke-width="4"/>
          <text x="30" y="38" font-size="22" font-weight="900" fill="#713F12" text-anchor="middle">$</text>
        </g>
        <g transform="translate(460, 140) rotate(25)" filter="url(#shadow)">
          <circle cx="30" cy="30" r="28" fill="#FACC15" stroke="#EAB308" stroke-width="4"/>
          <text x="30" y="39" font-size="26" font-weight="900" fill="#713F12" text-anchor="middle">$</text>
        </g>
        <g transform="translate(110, 260) rotate(15)" filter="url(#shadow)">
          <rect x="0" y="0" width="70" height="38" rx="6" fill="#22C55E" stroke="#16A34A" stroke-width="2"/>
          <circle cx="35" cy="19" r="10" fill="#DCFCE7"/>
          <text x="35" y="24" font-size="14" font-weight="900" fill="#166534" text-anchor="middle">$27</text>
        </g>
        <g transform="translate(440, 280) rotate(-15)" filter="url(#shadow)">
          <rect x="0" y="0" width="70" height="38" rx="6" fill="#22C55E" stroke="#16A34A" stroke-width="2"/>
          <circle cx="35" cy="19" r="10" fill="#DCFCE7"/>
          <text x="35" y="24" font-size="14" font-weight="900" fill="#166534" text-anchor="middle">$27</text>
        </g>

        <!-- BUDDY CHARACTER (Behind Coin) -->
        <!-- Antenna with dollar sign -->
        <rect x="294" y="80" width="12" height="40" rx="6" fill="#A3A3B2"/>
        <circle cx="300" cy="75" r="16" fill="url(#orangeGrad)" filter="url(#shadow)"/>
        <text x="300" y="81" font-size="16" font-weight="900" fill="#FFF" text-anchor="middle">$</text>

        <!-- Ears -->
        <rect x="180" y="160" width="22" height="54" rx="10" fill="url(#orangeGrad)"/>
        <rect x="398" y="160" width="22" height="54" rx="10" fill="url(#orangeGrad)"/>

        <!-- Head Base -->
        <rect x="195" y="115" width="210" height="160" rx="55" fill="url(#bodyGrad)" filter="url(#shadow)"/>

        <!-- Face Screen -->
        <rect x="215" y="135" width="170" height="120" rx="40" fill="url(#screenGrad)"/>

        <!-- Dollar Sign Star Eyes -->
        <text x="258" y="200" font-size="34" font-weight="900" fill="#22C55E" text-anchor="middle">$$</text>
        <text x="342" y="200" font-size="34" font-weight="900" fill="#22C55E" text-anchor="middle">$$</text>

        <!-- Rosy Cheeks -->
        <circle cx="238" cy="215" r="12" fill="#F26B21" opacity="0.6"/>
        <circle cx="362" cy="215" r="12" fill="#F26B21" opacity="0.6"/>

        <!-- Happy Open Grin -->
        <path d="M275 220Q300 245 325 220" stroke="#00F5D4" stroke-width="6" stroke-linecap="round" fill="none"/>

        <!-- GIANT GOLDEN COIN HUGGED BY BUDDY -->
        <g transform="translate(185, 230)" filter="url(#shadow)">
          <circle cx="115" cy="115" r="105" fill="#EAB308"/>
          <circle cx="115" cy="115" r="98" fill="url(#orangeGrad)"/>
          <circle cx="115" cy="115" r="88" fill="#FACC15"/>
          <!-- Inner border -->
          <circle cx="115" cy="115" r="76" stroke="#CA8A04" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
          <!-- Massive Dollar Symbol -->
          <text x="115" y="145" font-size="95" font-weight="900" fill="#854D0E" text-anchor="middle">$</text>
        </g>

        <!-- Buddy's Hands Hugging The Coin (Drawn over coin) -->
        <circle cx="190" cy="330" r="26" fill="url(#orangeGrad)" filter="url(#shadow)"/>
        <circle cx="410" cy="330" r="26" fill="url(#orangeGrad)" filter="url(#shadow)"/>

        <!-- Feet -->
        <ellipse cx="255" cy="450" rx="28" ry="16" fill="url(#orangeGrad)"/>
        <ellipse cx="345" cy="450" rx="28" ry="16" fill="url(#orangeGrad)"/>
      </svg>
    </div>

    <div class="footer">
      <div class="footer-left">Package your knowledge into digital income · <b>Free Tool</b></div>
      <div class="footer-cta">Start Free Today →</div>
    </div>
  </div>
</body>
</html>
